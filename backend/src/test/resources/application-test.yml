spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

jwt:
  secret: test-secret-key-for-testing-which-is-long-enough-to-meet-256-bit-requirement
  expiration: 86400000

logging:
  level:
    com.unique: DEBUG
    org.hibernate.SQL: DEBUG
